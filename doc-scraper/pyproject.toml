[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-scraper"
version = "0.1.0"
description = "A Python package to scrape context from any URL for LLM context."
readme = "README.md"
authors = [{ name = "Jules", email = "jules@example.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "crawl4ai",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
doc-scraper = "doc_scraper.cli:app"

[project.urls]
"Homepage" = "https://github.com/example/doc-scraper"
"Bug Tracker" = "https://github.com/example/doc-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]
